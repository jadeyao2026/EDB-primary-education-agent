# Eval set for the three cases the task says will be probed:
#   covered   - the pages answer it; expect an answer with a citation
#   uncovered - the pages do not answer it; expect an explicit "I don't know", no citation invented
#   edge      - ambiguous, out of scope, or partially covered; expect honest scoping
#
# `expect_phrases` is checked loosely (any one match counts) because wording varies by model run.

